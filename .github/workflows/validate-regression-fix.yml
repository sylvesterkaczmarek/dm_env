name: Exact-source regression validation
on:
  push:
    branches:
      - 'validation/discrete-array-integer-limits-20260929'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '1.26.4'
          - python: '3.12'
            numpy: '2.5.3'
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/dm_env
          ref: '3335013894f56fb598ef49ad60753c5ddde9fedf'
          path: work
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: |
          python -m pip install setuptools==80.10.2 wheel build pytest==9.1.1 pytest-cov==7.1.0 ruff yapf==0.43.0 numpy==${{ matrix.numpy }}
          python -m pip install --no-build-isolation -e ./work numpy==${{ matrix.numpy }}
      - name: Verify source, original failures and installed package
        run: python validation/verify.py work evidence
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
